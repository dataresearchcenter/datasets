name: do_ocds_dgcp
title: Dominican Republic - Dirección General de Contrataciones Públicas
prefix: ocds
country: do
summary: |
  Public procurement contracts from the Dominican Republic's DGCP (Dirección General
  de Contrataciones Públicas), covering federal, local, and central government agencies.
description: |
  This dataset contains government procurement records from local and central agencies
  in the Dominican Republic using the transactional portal managed by DGCP. The data
  covers the full contracting process including parties, tenders, awards, contracts,
  documents, and amendments.

  The dataset includes 344,357 parties, 169,354 tenders, 155,287 awards, and 211,802
  contracts. Certain purchases are excluded from the dataset, such as petty cash
  transactions under RD$50,000 and foreign service office acquisitions. Data is
  retrieved monthly with daily updates.
publisher:
  name: Dirección General de Contrataciones Públicas (DGCP)
  description: |
    DGCP is the Dominican Republic's General Directorate of Public Procurement,
    responsible for managing and overseeing government procurement processes through
    their transactional portal. The agency ensures transparency in public contracting.
  url: https://www.dgcp.gob.do/
  country: do
  official: true
