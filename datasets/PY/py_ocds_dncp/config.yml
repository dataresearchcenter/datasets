name: py_ocds_dncp
prefix: ocds
country: py
title: 'OCDS: Dirección Nacional de Contrataciones Públicas (DNCP)'
summary: Public procurement data from DNCP in OCDS format.
description: |
  This dataset contains public procurement records from DNCP published in the
  Open Contracting Data Standard (OCDS) format. The data includes information about
  procurement planning, tenders, awards, contracts, and implementation, providing
  transparency in public spending and contracting processes.
publisher:
  name: DNCP
  description: |
    DNCP publishes public procurement data to promote transparency and
    accountability in government contracting.
  url: https://data.open-contracting.org/en/publication/63/
  country: py
  official: true
url: https://data.open-contracting.org/en/publication/63/
data:
  url: https://data.open-contracting.org/en/publication/63/download?name=full.jsonl.gz
  format: OCDS 1.1
frequency: daily
category: procurement
license: https://creativecommons.org/licenses/by/4.0/
maintainer:
  name: DARC
  url: https://dataresearchcenter.org
  logo_url: https://cdn.investigativedata.org/style/logos/darc/svg/DARC-Logo-RGB-Horizontal-Neg.svg
git_repo: https://github.com/dataresearchcenter/datasets
resources:
