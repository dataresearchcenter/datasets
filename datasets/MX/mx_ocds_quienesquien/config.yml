name: mx_ocds_quienesquien
title: Mexico - QuiénEsQuién.Wiki
prefix: ocds
country: mx
summary: |
  Mexican public procurement data aggregated from multiple sources including Compranet
  and other government institutions, compiled by PODER for transparency research.
description: |
  This dataset aggregates Mexican public contracting information from multiple sources
  including Compranet (the government contracting system) spanning 2010-present, plus
  data from other government institutions and civil society organizations. The data
  was compiled by PODER (Project on Organizing, Development, Education, and Research)
  for their QuiénEsQuién.Wiki transparency platform.

  The dataset contains 1,661 contracting processes with party, planning, tender, award,
  and contract information. This is a snapshot dataset from March 2022 that is no
  longer being updated. The data is made available under a Creative Commons
  Attribution-NonCommercial-ShareAlike license.
publisher:
  name: PODER (Project on Organizing, Development, Education, and Research)
  description: |
    PODER is a Mexican civil society organization focused on corporate accountability,
    transparency, and anti-corruption research. They compiled this procurement dataset
    from multiple government and civil society sources for the QuiénEsQuién.Wiki
    platform, which maps relationships between government contracts and private entities.
  url: https://www.projectpoder.org/
