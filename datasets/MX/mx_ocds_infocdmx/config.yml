name: mx_ocds_infocdmx
prefix: ocds
country: mx
title: 'OCDS: Instituto de Transparencia de la Ciudad de México (INFOCDMX)'
summary: Public procurement data from INFOCDMX in OCDS format.
description: |
  This dataset contains public procurement records from INFOCDMX published in the
  Open Contracting Data Standard (OCDS) format. The data includes information about
  procurement planning, tenders, awards, contracts, and implementation, providing
  transparency in public spending and contracting processes.
publisher:
  name: INFOCDMX
  description: |
    INFOCDMX publishes public procurement data to promote transparency and
    accountability in government contracting.
  url: https://data.open-contracting.org/en/publication/111/
  country: mx
  official: true
url: https://data.open-contracting.org/en/publication/111/
