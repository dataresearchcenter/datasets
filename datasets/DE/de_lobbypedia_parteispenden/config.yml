name: de_lobbypedia_parteispenden
title: Parteispenden (Lobbycontrol)
prefix: de-lp
country: de
summary: >
  Lobbypedia is an independent, lobby-critical online encyclopedia provided by
  LobbyControl e.V. The Parteispenden database provides information on
  donations to political parties from companies or private persons.
publisher:
  name: Lobbycontrol
  description: Non-profit organisation
  url: https://lobbypedia.de/wiki/Parteispenden-datenbank

# Semantic MediaWiki ask query against the lobbypedia api. SMW caps results
# at 10.000 per query (and silently resets offsets beyond ~5.000, so
# pagination can't recover more). The extract handler iterates the `{year}`
# placeholder over single years from `first_year` until next year (plus guard
# queries catching anything outside that range) - single years stay far below
# the cap. The handler raises if a year ever hits the cap.
extract:
  sources:
    - name: parteispenden
      uri: https://lobbypedia.de/w/api.php?action=ask&format=json
      data:
        first_year: 2000
        query: >-
          [[Kategorie:Parteispende]]
          [[Parteispende/Kategorie::juristische Person||natürliche Person]]
          [[Jahr::{year}]]
          |?Geldgeber|?Parteispende/Kategorie=Kategorie|?Betrag|?Empfänger
          |?Jahr|?Ort|?Bundesland|?Branche|?Schlagworte|limit=10000
  handler: ./extract.py:handle

transform:
  handler: ./transform.py:handle
