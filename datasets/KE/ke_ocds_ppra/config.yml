name: ke_ocds_ppra
prefix: ocds
country: ke
title: 'OCDS: Public Procurement Regulatory Authority (PPRA)'
summary: Public procurement data from Public Procurement Regulatory Authority in OCDS
  format.
description: |
  This dataset contains public procurement records from Public Procurement Regulatory Authority published in the
  Open Contracting Data Standard (OCDS) format. The data includes information about
  procurement planning, tenders, awards, contracts, and implementation, providing
  transparency in public spending and contracting processes.
