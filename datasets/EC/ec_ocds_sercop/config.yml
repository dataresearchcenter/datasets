name: ec_ocds_sercop
prefix: ocds
country: ec
title: 'OCDS: Servicio Nacional de Contratación Pública de Ecuador (SERCOP)'
summary: Public procurement data from SERCOP in OCDS format.
description: |
  This dataset contains public procurement records from SERCOP published in the
  Open Contracting Data Standard (OCDS) format. The data includes information about
  procurement planning, tenders, awards, contracts, and implementation, providing
  transparency in public spending and contracting processes.
publisher:
  name: SERCOP
  description: |
    SERCOP publishes public procurement data to promote transparency and
    accountability in government contracting.
  url: https://data.open-contracting.org/en/publication/110/
  country: ec
  official: true
url: https://data.open-contracting.org/en/publication/110/
data:
  url: https://data.open-contracting.org/en/publication/110/download?name=full.jsonl.gz
  format: OCDS 1.1
frequency: daily
category: procurement
license: https://creativecommons.org/licenses/by/4.0/
maintainer:
  name: DARC
  url: https://dataresearchcenter.org
  logo_url: https://cdn.investigativedata.org/style/logos/darc/svg/DARC-Logo-RGB-Horizontal-Neg.svg
git_repo: https://github.com/dataresearchcenter/datasets
resources:
- name: entities.ftm.json
  url: https://data.ftm.store/ec_ocds_sercop/entities.ftm.json
  mime_type: application/json+ftm
extract:
  handler: common.ocds.extract:handle
  sources:
