name: md_ocds_ministry_of_finance
prefix: ocds
country: md
title: 'OCDS: Ministry of Finance'
summary: Public procurement data from Ministry of Finance in OCDS format.
description: |
  This dataset contains public procurement records from Ministry of Finance published in the
  Open Contracting Data Standard (OCDS) format. The data includes information about
  procurement planning, tenders, awards, contracts, and implementation, providing
  transparency in public spending and contracting processes.
