name: uy_ocds_arce_hist
prefix: ocds
country: uy
title: 'OCDS: Agencia Reguladora de Compras Estatales (ARCE) - Historical'
summary: Public procurement data from ARCE in OCDS format.
description: |
  This dataset contains public procurement records from ARCE published in the
  Open Contracting Data Standard (OCDS) format. The data includes information about
  procurement planning, tenders, awards, contracts, and implementation, providing
  transparency in public spending and contracting processes.
