name: br_ocds_seges
prefix: ocds
country: br
title: 'OCDS: Secretaria de Gestão e Inovação (Federal Government)'
summary: Public procurement data from Secretaria de Gestão e Inovação in OCDS format.
description: |
  This dataset contains public procurement records from Secretaria de Gestão e Inovação published in the
  Open Contracting Data Standard (OCDS) format. The data includes information about
  procurement planning, tenders, awards, contracts, and implementation, providing
  transparency in public spending and contracting processes.
publisher:
  name: Secretaria de Gestão e Inovação
  description: |
    Secretaria de Gestão e Inovação publishes public procurement data to promote transparency and
    accountability in government contracting.
