name: hn_ocds_iaip
prefix: ocds
country: hn
title: 'OCDS: Instituto de Acceso a la Información Pública (IAIP)'
summary: Public procurement data from IAIP in OCDS format.
description: |
  This dataset contains public procurement records from IAIP published in the
  Open Contracting Data Standard (OCDS) format. The data includes information about
  procurement planning, tenders, awards, contracts, and implementation, providing
  transparency in public spending and contracting processes.
publisher:
  name: IAIP
  description: |
    IAIP publishes public procurement data to promote transparency and
    accountability in government contracting.
  url: https://data.open-contracting.org/en/publication/113/
  country: hn
  official: true
url: https://data.open-contracting.org/en/publication/113/
data:
