name: hn_ocds_sisocs
prefix: ocds
country: hn
title: 'OCDS: Sistema de Información y Seguimiento de Obras y Contratos (SISOCS)'
summary: Public procurement data from SISOCS in OCDS format.
description: |
  This dataset contains public procurement records from SISOCS published in the
  Open Contracting Data Standard (OCDS) format. The data includes information about
  procurement planning, tenders, awards, contracts, and implementation, providing
  transparency in public spending and contracting processes.
publisher:
  name: SISOCS
  description: |
    SISOCS publishes public procurement data to promote transparency and
    accountability in government contracting.
  url: https://data.open-contracting.org/en/publication/25/
  country: hn
  official: true
url: https://data.open-contracting.org/en/publication/25/
data:
  url: https://data.open-contracting.org/en/publication/25/download?name=full.jsonl.gz
  format: OCDS 1.1
frequency: never
category: procurement
license: https://creativecommons.org/licenses/by/4.0/
maintainer:
  name: DARC
  url: https://dataresearchcenter.org
  logo_url: https://cdn.investigativedata.org/style/logos/darc/svg/DARC-Logo-RGB-Horizontal-Neg.svg
git_repo: https://github.com/dataresearchcenter/datasets
