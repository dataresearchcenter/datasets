name: xk_ocds_pprc
prefix: ocds
country: xk
title: 'OCDS: Public Procurement Regulatory Commission (PPRC)'
summary: Public procurement data from Public Procurement Regulatory Commission in
  OCDS format.
description: |
  This dataset contains public procurement records from Public Procurement Regulatory Commission published in the
  Open Contracting Data Standard (OCDS) format. The data includes information about
  procurement planning, tenders, awards, contracts, and implementation, providing
  transparency in public spending and contracting processes.
