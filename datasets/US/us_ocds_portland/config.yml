name: us_ocds_portland
prefix: ocds
country: us
title: 'OCDS: Procurement Services of the City of Portland'
summary: Public procurement data from City of Portland in OCDS format.
description: |
  This dataset contains public procurement records from City of Portland published in the
  Open Contracting Data Standard (OCDS) format. The data includes information about
  procurement planning, tenders, awards, contracts, and implementation, providing
  transparency in public spending and contracting processes.
publisher:
  name: City of Portland
  description: |
    City of Portland publishes public procurement data to promote transparency and
    accountability in government contracting.
  url: https://data.open-contracting.org/en/publication/155/
  country: us
  official: true
url: https://data.open-contracting.org/en/publication/155/
