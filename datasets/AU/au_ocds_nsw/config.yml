name: au_ocds_nsw
prefix: ocds
country: au
title: 'OCDS: New South Wales: Treasury'
summary: Public procurement data from New South Wales Treasury in OCDS format.
description: |
  This dataset contains public procurement records from New South Wales Treasury published in the
  Open Contracting Data Standard (OCDS) format. The data includes information about
  procurement planning, tenders, awards, contracts, and implementation, providing
  transparency in public spending and contracting processes.
publisher:
  name: New South Wales Treasury
  description: |
    New South Wales Treasury publishes public procurement data to promote transparency and
    accountability in government contracting.
  url: https://data.open-contracting.org/en/publication/11/
  country: au
  official: true
url: https://data.open-contracting.org/en/publication/11/
data:
  url: https://data.open-contracting.org/en/publication/11/download?name=full.jsonl.gz
  format: OCDS 1.1
frequency: daily
category: procurement
license: https://creativecommons.org/licenses/by/4.0/
maintainer:
  name: DARC
  url: https://dataresearchcenter.org
  logo_url: https://cdn.investigativedata.org/style/logos/darc/svg/DARC-Logo-RGB-Horizontal-Neg.svg
git_repo: https://github.com/dataresearchcenter/datasets
extract:
  handler: common.ocds.extract:handle
  sources:
  - uri: https://data.open-contracting.org/en/publication/11/download?name=full.jsonl.gz
