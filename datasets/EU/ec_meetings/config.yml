name: ec_meetings
title: European Commission - Meetings with interest representatives and missions
prefix: ec
country: eu
summary: |
  The Commission applies strict rules on transparency concerning its contacts
  and relations with interest representatives: it requires all its Members, their
  closest advisors (members of Cabinet) and all Directors-General to meet only
  interest representatives that are registered in the Transparency Register and
  to publish information on such meetings. Those measures fall within the
  meaning and scope of the conditionality and complementary transparency
  measures provided for in the Interinstitutional Agreement establishing the
  mandatory Transparency Register.
description: |
  This dataset covers the meetings held with interest representatives by the
  commissioners of the Von der Leyen (2024-2029), Von der Leyen (2019-2024) and
  Juncker (2014-2019) colleges, by the members of their cabinets, by the
  directorates-general and by the executive agencies. It also covers the
  missions of the commissioners, published every two months under Article 6(2)
  of the Code of Conduct for the Members of the European Commission, including
  the reimbursed travel, accommodation, daily allowance and miscellaneous costs.

  Meetings become `Event` entities organized by the hosting body or
  commissioner, involving the commission representatives that attended and the
  interest representatives that were met. Missions become `Event` entities
  spanning their start and end date, with the reimbursed amounts kept as notes.

  Note that the portal no longer publishes the Transparency Register id of the
  interest representatives it lists, so organisations are keyed by their
  fingerprinted name and cannot be linked to the register by identifier.
category: poi
tags:
  - lobbyism
publisher:
  name: European Commission Secretariat-General
  description: |
    The Secretariat-General is responsible for the overall coherence of the
    Commission’s work – both in shaping new policies, and in steering them
    through the other EU institutions. It supports the whole Commission.
  url: https://commission.europa.eu/about-european-commission/departments-and-executive-agencies/secretariat-general_en
maintainer:
  name: DARC
  url: https://dataresearchcenter.org
  logo_url: https://cdn.investigativedata.org/style/logos/darc/svg/DARC-Logo-RGB-Horizontal-Neg.svg
git_repo: https://github.com/dataresearchcenter/datasets

# One source per section of https://ec.europa.eu/transparency-initiative/meetings/.
# The handler walks each section table to its hosts, and takes the rows from the
# xlsx export every host detail page links to. The commissioners section covers
# three colleges and yields the meetings of the commissioners, the meetings of
# their cabinets and their missions.
extract:
  handler: ./extract.py:handle
  sources:
    - name: commissioners
      uri: https://ec.europa.eu/transparency-initiative/meetings/listcommissioners?collegeid=0
    - name: dg
      uri: https://ec.europa.eu/transparency-initiative/meetings/listdg
    - name: ea
      uri: https://ec.europa.eu/transparency-initiative/meetings/listea

transform:
  handler: ./transform.py:handle
