title: 'OCDS: Dirección de Compras y Contratación Pública - Historical'
summary: Public procurement data from Dirección de Compras y Contratación Pública
  in OCDS format.
description: |
  This dataset contains public procurement records from Dirección de Compras y Contratación Pública published in the
  Open Contracting Data Standard (OCDS) format. The data includes information about
  procurement planning, tenders, awards, contracts, and implementation, providing
  transparency in public spending and contracting processes.
