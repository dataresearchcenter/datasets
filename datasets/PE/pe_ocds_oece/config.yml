name: pe_ocds_oece
prefix: ocds
country: pe
title: 'OCDS: Organismo Especializado para las Contrataciones Públicas Eficientes
  (OECE)'
summary: Public procurement data from OECE in OCDS format.
description: |
  This dataset contains public procurement records from OECE published in the
  Open Contracting Data Standard (OCDS) format. The data includes information about
  procurement planning, tenders, awards, contracts, and implementation, providing
  transparency in public spending and contracting processes.
publisher:
  name: OECE
  description: |
    OECE publishes public procurement data to promote transparency and
    accountability in government contracting.
  url: https://data.open-contracting.org/en/publication/135/
  country: pe
  official: true
url: https://data.open-contracting.org/en/publication/135/
data:
  url: https://data.open-contracting.org/en/publication/135/download?name=full.jsonl.gz
  format: OCDS 1.1
frequency: daily
category: procurement
license: https://creativecommons.org/licenses/by/4.0/
maintainer:
  name: DARC
  url: https://dataresearchcenter.org
  logo_url: https://cdn.investigativedata.org/style/logos/darc/svg/DARC-Logo-RGB-Horizontal-Neg.svg
git_repo: https://github.com/dataresearchcenter/datasets
resources:
- name: entities.ftm.json
  url: https://data.ftm.store/pe_ocds_oece/entities.ftm.json
  mime_type: application/json+ftm
extract:
  handler: util.ocds.extract:handle
  sources:
  - uri: https://data.open-contracting.org/en/publication/135/download?name=full.jsonl.gz
transform:
  handler: util.ocds.transform:handle
