name: ar_ocds_dgcc
prefix: ocds
country: ar
title: 'OCDS: Dirección General de Compras y Contrataciones (Ciudad de Buenos Aires)'
summary: Public procurement data from Dirección General de Compras y Contrataciones
  in OCDS format.
description: |
  This dataset contains public procurement records from Dirección General de Compras y Contrataciones published in the
  Open Contracting Data Standard (OCDS) format. The data includes information about
  procurement planning, tenders, awards, contracts, and implementation, providing
  transparency in public spending and contracting processes.
publisher:
  name: Dirección General de Compras y Contrataciones
  description: |
