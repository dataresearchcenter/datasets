name: co_ocds_ancp
prefix: ocds
country: co
title: 'OCDS: Agencia Nacional de Contratación Pública (Colombia Compra Eficiente)'
summary: Public procurement data from Colombia Compra Eficiente in OCDS format.
description: |
  This dataset contains public procurement records from Colombia Compra Eficiente published in the
  Open Contracting Data Standard (OCDS) format. The data includes information about
  procurement planning, tenders, awards, contracts, and implementation, providing
  transparency in public spending and contracting processes.
