name: gb_ocds_spcd
prefix: ocds
country: gb
title: 'OCDS: Scottish Procurement and Commercial Directorate (SPCD)'
summary: Public procurement data from Scottish Government in OCDS format.
description: |
  This dataset contains public procurement records from Scottish Government published in the
  Open Contracting Data Standard (OCDS) format. The data includes information about
  procurement planning, tenders, awards, contracts, and implementation, providing
  transparency in public spending and contracting processes.
publisher:
  name: Scottish Government
  description: |
    Scottish Government publishes public procurement data to promote transparency and
    accountability in government contracting.
