title: 'OCDS: Ministerio de Finanzas Públicas'
summary: Public procurement data from Ministerio de Finanzas Públicas in OCDS format.
description: |
  This dataset contains public procurement records from Ministerio de Finanzas Públicas published in the
  Open Contracting Data Standard (OCDS) format. The data includes information about
  procurement planning, tenders, awards, contracts, and implementation, providing
  transparency in public spending and contracting processes.
