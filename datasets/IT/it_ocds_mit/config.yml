name: it_ocds_mit
prefix: ocds
country: it
title: 'OCDS: Ministry of Infrastructure and Transport'
summary: Public procurement data from Ministry of Infrastructure and Transport in
  OCDS format.
description: |
  This dataset contains public procurement records from Ministry of Infrastructure and Transport published in the
  Open Contracting Data Standard (OCDS) format. The data includes information about
  procurement planning, tenders, awards, contracts, and implementation, providing
  transparency in public spending and contracting processes.
publisher:
  name: Ministry of Infrastructure and Transport
  description: |
    Ministry of Infrastructure and Transport publishes public procurement data to promote transparency and
    accountability in government contracting.
  url: https://data.open-contracting.org/en/publication/141/
  country: it
  official: true
url: https://data.open-contracting.org/en/publication/141/
data:
  url: https://data.open-contracting.org/en/publication/141/download?name=full.jsonl.gz
  format: OCDS 1.1
frequency: daily
category: procurement
license: https://creativecommons.org/licenses/by/4.0/
maintainer:
  name: DARC
  url: https://dataresearchcenter.org
  logo_url: https://cdn.investigativedata.org/style/logos/darc/svg/DARC-Logo-RGB-Horizontal-Neg.svg
git_repo: https://github.com/dataresearchcenter/datasets
resources:
- name: entities.ftm.json
  url: https://data.ftm.store/it_ocds_mit/entities.ftm.json
  mime_type: application/json+ftm
extract:
  handler: util.ocds.extract:handle
  sources:
  - uri: https://data.open-contracting.org/en/publication/141/download?name=full.jsonl.gz
