name: zm_ocds_zppa
prefix: ocds
country: zm
title: 'OCDS: Public Procurement Authority (ZPPA)'
summary: Public procurement data from Zambia Public Procurement Authority in OCDS
  format.
description: |
  This dataset contains public procurement records from Zambia Public Procurement Authority published in the
  Open Contracting Data Standard (OCDS) format. The data includes information about
  procurement planning, tenders, awards, contracts, and implementation, providing
  transparency in public spending and contracting processes.
publisher:
  name: Zambia Public Procurement Authority
  description: |
    Zambia Public Procurement Authority publishes public procurement data to promote transparency and
    accountability in government contracting.
