name: pt_ocds_impic
prefix: ocds
country: pt
title: 'OCDS: Institute of Public Procurement, Real Estate and Construction (IMPIC)'
summary: Public procurement data from IMPIC in OCDS format.
description: |
  This dataset contains public procurement records from IMPIC published in the
  Open Contracting Data Standard (OCDS) format. The data includes information about
  procurement planning, tenders, awards, contracts, and implementation, providing
  transparency in public spending and contracting processes.
publisher:
  name: IMPIC
  description: |
    IMPIC publishes public procurement data to promote transparency and
    accountability in government contracting.
  url: https://data.open-contracting.org/en/publication/38/
  country: pt
  official: true
url: https://data.open-contracting.org/en/publication/38/
data:
