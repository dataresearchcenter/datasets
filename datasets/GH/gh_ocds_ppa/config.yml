name: gh_ocds_ppa
prefix: ocds
country: gh
title: 'OCDS: Public Procurement Authority (PPA)'
summary: Public procurement data from Public Procurement Authority in OCDS format.
description: |
  This dataset contains public procurement records from Public Procurement Authority published in the
  Open Contracting Data Standard (OCDS) format. The data includes information about
  procurement planning, tenders, awards, contracts, and implementation, providing
  transparency in public spending and contracting processes.
publisher:
  name: Public Procurement Authority
  description: |
    Public Procurement Authority publishes public procurement data to promote transparency and
    accountability in government contracting.
  url: https://data.open-contracting.org/en/publication/85/
  country: gh
  official: true
url: https://data.open-contracting.org/en/publication/85/
data:
  url: https://data.open-contracting.org/en/publication/85/download?name=full.jsonl.gz
  format: OCDS 1.1
frequency: monthly
category: procurement
license: https://creativecommons.org/licenses/by/4.0/
maintainer:
  name: DARC
  url: https://dataresearchcenter.org
  logo_url: https://cdn.investigativedata.org/style/logos/darc/svg/DARC-Logo-RGB-Horizontal-Neg.svg
git_repo: https://github.com/dataresearchcenter/datasets
resources:
- name: entities.ftm.json
  url: https://data.ftm.store/gh_ocds_ppa/entities.ftm.json
  mime_type: application/json+ftm
extract:
  handler: common.ocds.extract:handle
  sources:
  - uri: https://data.open-contracting.org/en/publication/85/download?name=full.jsonl.gz
transform:
  handler: common.ocds.transform:handle
