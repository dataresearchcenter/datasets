name: ng_ocds_edo
prefix: ocds
country: ng
title: 'OCDS: Edo State'
summary: Public procurement data from Edo State Government in OCDS format.
description: |
  This dataset contains public procurement records from Edo State Government published in the
  Open Contracting Data Standard (OCDS) format. The data includes information about
  procurement planning, tenders, awards, contracts, and implementation, providing
  transparency in public spending and contracting processes.
publisher:
  name: Edo State Government
  description: |
    Edo State Government publishes public procurement data to promote transparency and
    accountability in government contracting.
  url: https://data.open-contracting.org/en/publication/102/
  country: ng
  official: true
url: https://data.open-contracting.org/en/publication/102/
data:
  url: https://data.open-contracting.org/en/publication/102/download?name=full.jsonl.gz
  format: OCDS 1.1
frequency: never
category: procurement
license: https://creativecommons.org/licenses/by/4.0/
maintainer:
  name: DARC
  url: https://dataresearchcenter.org
  logo_url: https://cdn.investigativedata.org/style/logos/darc/svg/DARC-Logo-RGB-Horizontal-Neg.svg
git_repo: https://github.com/dataresearchcenter/datasets
