name: ng_ocds_bpp
prefix: ocds
country: ng
title: 'OCDS: Bureau of Public Procurement (BPP)'
summary: Public procurement data from Bureau of Public Procurement in OCDS format.
description: |
  This dataset contains public procurement records from Bureau of Public Procurement published in the
  Open Contracting Data Standard (OCDS) format. The data includes information about
  procurement planning, tenders, awards, contracts, and implementation, providing
  transparency in public spending and contracting processes.
