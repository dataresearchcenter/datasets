name: ca_ocds_montreal
title: Canada - Ville de Montréal
prefix: ocds
country: ca
summary: |
  Public procurement contracts from the City of Montreal, Canada's second-largest
  municipality, including tenders, awards, and contracts.
description: |
  This dataset contains public contracts published by the Ville de Montréal through
  their procurement transparency system. Montreal publishes comprehensive procurement
  data as part of their open data commitments, covering the full contracting process
  from planning through to implementation.

  The data includes detailed information about parties, planning, tenders, awards,
  contracts, documents, milestones, and amendments. Coverage begins in August 2011
  and continues to present with daily updates.
publisher:
  name: Ville de Montréal
  description: |
    The City of Montreal is the largest municipality in Quebec and the second-largest
    in Canada. The city government publishes procurement data as part of its open
    data and transparency initiatives.
