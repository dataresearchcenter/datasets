name: ca_ocds_quebec_sct
prefix: ocds
country: ca
title: 'OCDS: Québec: Secrétariat du Conseil du trésor'
summary: Public procurement data from Secrétariat du Conseil du trésor du Québec in
  OCDS format.
description: |
  This dataset contains public procurement records from Secrétariat du Conseil du trésor du Québec published in the
  Open Contracting Data Standard (OCDS) format. The data includes information about
  procurement planning, tenders, awards, contracts, and implementation, providing
  transparency in public spending and contracting processes.
publisher:
  name: Secrétariat du Conseil du trésor du Québec
  description: |
    Secrétariat du Conseil du trésor du Québec publishes public procurement data to promote transparency and
    accountability in government contracting.
