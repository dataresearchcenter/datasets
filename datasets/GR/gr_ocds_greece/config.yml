name: gr_ocds_greece
prefix: ocds
country: gr
title: 'OCDS: OpenTender Greece'
summary: Public procurement data from OpenTender in OCDS format.
description: |
  This dataset contains public procurement records from OpenTender published in the
  Open Contracting Data Standard (OCDS) format. The data includes information about
  procurement planning, tenders, awards, contracts, and implementation, providing
  transparency in public spending and contracting processes.
publisher:
  name: OpenTender
  description: |
    OpenTender publishes public procurement data to promote transparency and
    accountability in government contracting.
  url: https://data.open-contracting.org/en/publication/55/
  country: gr
  official: true
url: https://data.open-contracting.org/en/publication/55/
data:
  url: https://data.open-contracting.org/en/publication/55/download?name=full.jsonl.gz
  format: OCDS 1.1
frequency: annually
category: procurement
license: https://creativecommons.org/licenses/by/4.0/
maintainer:
  name: DARC
  url: https://dataresearchcenter.org
  logo_url: https://cdn.investigativedata.org/style/logos/darc/svg/DARC-Logo-RGB-Horizontal-Neg.svg
git_repo: https://github.com/dataresearchcenter/datasets
resources:
- name: entities.ftm.json
  url: https://data.ftm.store/gr_ocds_greece/entities.ftm.json
  mime_type: application/json+ftm
extract:
  handler: common.ocds.extract:handle
  sources:
