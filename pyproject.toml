[project]
name = "datasets"
version = "2025.6.4.0"
description = "DARC Data Library"
authors = [
    { name = "Alexandra Ștefănescu", email = "alex@dataresearchcenter.org" },
    { name = "Karina Shedrofsky", email = "karina@dataresearchcenter.org" },
    { name = "Jan Strozyk", email = "jan@dataresearchcenter.org" },
    { name = "Simon Wörpel", email = "simon@dataresearchcenter.org" },
]
license = { text = "AGPLv3+" }
readme = "README.md"
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx (>=0.28.1,<0.29.0)",
    "plyvel (>=1.5.1,<2.0.0)",
    "ijson (>=3.4.0,<4.0.0)",
    "beautifulsoup4 (>=4.13.4,<5.0.0)",
    "followthemoney (>=4.5.0,<5.0.0)",
    "pygit2 (>=1.18.0,<2.0.0)",
    "ftfy (>=6.3.1,<7.0.0)",
    "lzip (>=1.2.0,<2.0.0)",
    "pycountry (>=24.6.1,<25.0.0)",
    "memorious4 (>=4.0.0,<5.0.0)",
    "investigraph (>=0.8.0,<0.9.0)",
    "ftm-lakehouse (>=0.2.0,<0.3.0)",
    "anystore (>=1.0.1,<2.0.0)",
    "ftmq (>=4.5.2,<5.0.0)",
]

[project.urls]
Homepage = "https://dataresearchcenter.org/library"
Documentation = "https://github.com/dataresearchcenter/datasets"
Repository = "https://github.com/dataresearchcenter/datasets"
Issues = "https://github.com/dataresearchcenter/datasets/issues"

[tool.poetry]
packages = [
    { include = "common" }
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.bumpver]
current_version = "2025.6.4.0"
version_pattern = "YYYY.MM.DD.PATCH"
commit_message = "🔖 bump version {old_version} -> {new_version}"
tag_message = "{new_version}"
tag_scope = "default"
pre_commit_hook = ""
post_commit_hook = ""
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = ['current_version = "{version}"', 'version = "{version}"']
"README.md" = ["{version}"]

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.poetry.group.dev.dependencies]
ipython = "^9.3.0"
ipdb = "^0.13.13"
bumpver = "^2025.1131"
pre-commit = "^4.5.1"
