name: datasets_weekly_worldbank

on:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 06:00 UTC
  workflow_dispatch: {}

jobs:
  data:
    runs-on: ubuntu-latest
    container: ghcr.io/dataresearchcenter/datasets:latest
    env:
      HOME: /home/1000
      LAKEHOUSE_URI: ${{ secrets.LAKEHOUSE_URI }}
      LAKEHOUSE_API_KEY: ${{ secrets.LAKEHOUSE_API_KEY }}
      LAKEHOUSE_API_SECRET: ${{ secrets.LAKEHOUSE_API_SECRET }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - dataset: worldbank_ifc_advisory_services
            runner: investigraph
          - dataset: worldbank_ifc_investment_services
            runner: investigraph
          - dataset: worldbank_procurement_awards
            runner: investigraph
          - dataset: worldbank_procurement_projects
            runner: investigraph
          - dataset: worldbank_procurement_notices
            runner: investigraph
    steps:
      - name: Run ${{ matrix.runner }} for ${{ matrix.dataset }}
        run: make ${{ matrix.runner }} dataset=${{ matrix.dataset }} DATASETS_DIR=.
        working-directory: /datasets

