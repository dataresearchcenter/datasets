name: ocds_weekly

on:
  schedule:
    - cron: "0 8 * * 0"  # Every Sunday at 08:00 UTC
  workflow_dispatch: {}

jobs:
  data:
    runs-on: ubuntu-latest
    container: ghcr.io/dataresearchcenter/datasets:latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      FSSPEC_S3_ENDPOINT_URL: ${{ secrets.FSSPEC_S3_ENDPOINT_URL }}
    strategy:
      fail-fast: false
      matrix:
        dataset:
          - es_ocds_spain
          - lt_ocds_lithuania
          - mx_ocds_secadmin_nuevo_leon
          - ro_ocds_romania
          - us_ocds_portland
    steps:
      - name: parse and write the dataset
        run: make investigraph dataset=${{ matrix.dataset }} DATASETS_DIR=.
        working-directory: /datasets

  catalog:
    needs: data
    if: always()
    runs-on: ubuntu-latest
    container: ghcr.io/dataresearchcenter/datasets:latest
    defaults:
      run:
        working-directory: /datasets
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      FSSPEC_S3_ENDPOINT_URL: ${{ secrets.FSSPEC_S3_ENDPOINT_URL }}
    steps:
      - name: Update the catalog
        run: "make publish"
