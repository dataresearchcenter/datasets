name: ocds_daily

on:
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch: {}

jobs:
  data:
    runs-on: ubuntu-latest
    container: ghcr.io/dataresearchcenter/datasets:latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      FSSPEC_S3_ENDPOINT_URL: ${{ secrets.FSSPEC_S3_ENDPOINT_URL }}
    strategy:
      fail-fast: false
      matrix:
        dataset:
          - ar_ocds_dnv
          - au_ocds_nsw
          - br_ocds_seges
          - ca_ocds_montreal
          - cl_ocds_chilecompra_api
          - cl_ocds_chilecompra_hist
          - co_ocds_ancp
          - de_ocds_bmi
          - do_ocds_dgcp
          - ec_ocds_sercop
          - fr_ocds_dinum
          - gb_ocds_contracts_finder
          - gb_ocds_find_a_tender_service
          - gb_ocds_sell2wales
          - gb_ocds_spcd
          - gt_ocds_minfin
          - hn_ocds_oncae
          - it_ocds_mit
          - ke_ocds_ppra
          - md_ocds_ministry_of_finance
          - pa_ocds_dgcp
          - pe_ocds_oece
          - pe_ocds_peru_compras
          - py_ocds_dncp
          - py_ocds_ministerio_de_hacienda
          - rw_ocds_rppa
          - tz_ocds_ppra
          - uy_ocds_arce_api
    steps:
      - name: parse and write the dataset
        run: make investigraph dataset=${{ matrix.dataset }} DATASETS_DIR=.
        working-directory: /datasets

  catalog:
    needs: data
    if: always()
    runs-on: ubuntu-latest
    container: ghcr.io/dataresearchcenter/datasets:latest
    defaults:
      run:
        working-directory: /datasets
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      FSSPEC_S3_ENDPOINT_URL: ${{ secrets.FSSPEC_S3_ENDPOINT_URL }}
    steps:
      - name: Update the catalog
        run: "make publish"
