      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      FSSPEC_S3_ENDPOINT_URL: ${{ secrets.FSSPEC_S3_ENDPOINT_URL }}
    strategy:
      fail-fast: false
      matrix:
        dataset:
          # Daily
          - ar_ocds_dnv
          - au_ocds_nsw
          - br_ocds_seges
          - ca_ocds_montreal
          - cl_ocds_chilecompra_api
