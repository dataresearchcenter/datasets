          - is_ocds_iceland
          - lu_ocds_luxembourg
          - lv_ocds_latvia
          - mk_ocds_northmacedonia
          - mt_ocds_malta
          - mx_ocds_sea_aguascalientes
          - nl_ocds_netherlands
          - no_ocds_norway
          - pl_ocds_poland
          - pt_ocds_portugal
          - rs_ocds_serbia
          - se_ocds_sweden
          - si_ocds_slovenia
          - sk_ocds_slovakia
          - uy_ocds_arce_hist
          # Unknown frequency
          - al_ocds_ppc
          - au_ocds_austender
          - cr_ocds_poder_judicial
          - es_ocds_zaragoza
          - hn_ocds_iaip
          - hn_ocds_sefin
