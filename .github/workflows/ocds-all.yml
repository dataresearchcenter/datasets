          - gb_ocds_find_a_tender_service
          - gb_ocds_sell2wales
          - gb_ocds_spcd
          - gt_ocds_minfin
          - hn_ocds_oncae
          - it_ocds_mit
          - ke_ocds_ppra
          - md_ocds_ministry_of_finance
          - pa_ocds_dgcp
          - pe_ocds_oece
          - pe_ocds_peru_compras
          - py_ocds_dncp
          - py_ocds_ministerio_de_hacienda
          - rw_ocds_rppa
          - tz_ocds_ppra
          - uy_ocds_arce_api
          # Weekly
          - es_ocds_spain
          - lt_ocds_lithuania
          - mx_ocds_secadmin_nuevo_leon
          - ro_ocds_romania
          - us_ocds_portland
          # Monthly
          - ar_ocds_dgcc
          - ar_ocds_dgcgb
          - br_ocds_medicamentos_transparentes
          - ca_ocds_quebec_sct
          - gh_ocds_ppa
          - hr_ocds_narodne_navine_dd
          - it_ocds_italy
          - mx_ocds_inai
          - nl_ocds_minezk
          - ug_ocds_ppda
          - zm_ocds_zppa
          # Annually
          - at_ocds_austria
          - be_ocds_belgium
          - bg_ocds_bulgaria
          - bo_ocds_agetic
          - ch_ocds_switzerland
          - cy_ocds_cyprus
          - cz_ocds_czechia
          - de_ocds_germany
          - dk_ocds_denmark
          - ee_ocds_estonia
          - eu_ocds_institutions
          - fi_ocds_finland
          - fr_ocds_france
          - gb_ocds_uk
