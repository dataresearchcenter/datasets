          - ng_ocds_crossriver
          - ng_ocds_edo
          - ng_ocds_enugu
          - ng_ocds_gombe
          - ng_ocds_oyo
          - np_ocds_ppmo
          - pt_ocds_impic
    steps:
      - name: parse and write the dataset
        run: make investigraph dataset=${{ matrix.dataset }} DATASETS_DIR=.
        working-directory: /datasets

  catalog:
    needs: data
    if: always()
    runs-on: ubuntu-latest
    container: ghcr.io/dataresearchcenter/datasets:latest
    defaults:
      run:
        working-directory: /datasets
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      FSSPEC_S3_ENDPOINT_URL: ${{ secrets.FSSPEC_S3_ENDPOINT_URL }}
    steps:
      - name: Update the catalog
        run: "make publish"
