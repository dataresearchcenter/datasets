name: datasets_weekly

on:
  schedule:
    - cron: "0 6 * * 0"  # Every Sunday at 06:00 UTC
  workflow_dispatch: {}

jobs:
  data:
    runs-on: ubuntu-latest
    container: ghcr.io/dataresearchcenter/datasets:latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      FSSPEC_S3_ENDPOINT_URL: ${{ secrets.FSSPEC_S3_ENDPOINT_URL }}
    strategy:
      fail-fast: false
      matrix:
        dataset:
          - de_bnetza_mastr
          - worldbank_ifc_advisory_services
          - worldbank_ifc_investment_services
          - worldbank_procurement_awards
          - worldbank_procurement_projects
          - worldbank_procurement_notices
    steps:
      - name: parse and write the dataset
        run: "investigraph run -c /datasets/${{ matrix.dataset }}/config.yml --entities-uri s3://data.ftm.store/${{ matrix.dataset }}/entities.ftm.json --index-uri s3://data.ftm.store/${{ matrix.dataset }}/index.json"

  catalog:
    needs: data
    if: always()
    runs-on: ubuntu-latest
    container: ghcr.io/dataresearchcenter/datasets:latest
    defaults:
      run:
        working-directory: /datasets
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      FSSPEC_S3_ENDPOINT_URL: ${{ secrets.FSSPEC_S3_ENDPOINT_URL }}
    steps:
      - name: Update the catalog
        run: "make publish"
      - name: Notify success
        run: "anystore io -i ${{ secrets.DATASETS_WEEKLY_HEARTBEAT }}"
